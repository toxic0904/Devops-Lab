<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">ShopEase</div>
    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Categories</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <div class="hero-text">
        <h1>Discover Amazing Products</h1>
        <p>Shop the latest trends at the best prices.</p>
        <button>Shop Now</button>
    </div>
</section>

<section class="products">

    <div class="card">
        <img src="https://via.placeholder.com/250x200" alt="">
        <h3>Wireless Headphones</h3>
        <p>$79</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/250x200" alt="">
        <h3>Smart Watch</h3>
        <p>$149</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/250x200" alt="">
        <h3>Running Shoes</h3>
        <p>$99</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/250x200" alt="">
        <h3>Backpack</h3>
        <p>$59</p>
        <button>Add to Cart</button>
    </div>

</section>

<footer>
    <p>© 2026 ShopEase. All Rights Reserved.</p>
</footer>

</body>
</html>
